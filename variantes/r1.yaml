# R1 · Reglas de Edu · Con cochera · Cocina delante, baño junto al muro central, salón con chimenea
base: casa.yaml
nombre: "R1 · Con cochera: cocina delante y baño en el centro"
descripcion: >
  Sigue las reglas de Edu. A la izquierda, de delante hacia atrás, van la
  cocina en L con el ventanuco, el comedor y el salón junto a la chimenea,
  con la salida al patio. El baño queda en el centro, contra el muro central.
  El dormitorio va detrás de la cochera, con una ventana nueva al patio. La
  cochera se mantiene con unos 4,9 m de fondo, y para llegar al dormitorio
  se pasa por el lateral de la cochera, junto a la escalera.
salida: variantes/salida/r1.sh3d
resumen: variantes/salida/r1.md
plantas:
  - id: pb
    huecos:
      - {nombre: Ventanuco,        muro: fachada, x: 1.45, ancho: 0.40, alto: 0.45, elevacion: 1.00, tipo: ventana}
      - {nombre: Portón izquierdo, muro: fachada, x: 3.45, ancho: 2.00, alto: 2.60, elevacion: 0.00, tipo: puerta}
      - {nombre: Portón cochera,   muro: fachada, x: 8.40, ancho: 2.45, alto: 2.80, elevacion: 0.00, tipo: puerta}
