# R3 · Reglas de Edu · Sin cochera · Como R1, con la antigua cochera de recibidor y estudio
base: casa.yaml
nombre: "R3 · Sin cochera: recibidor y estudio delante"
descripcion: >
  Es la misma zona izquierda que R1: cocina delante, baño en el centro y
  salón junto a la chimenea. La antigua cochera pasa a ser recibidor y
  estudio, con el portón convertido en ventanal y abierta a la cocina por un
  hueco de 2,2 m en el muro central. Desde ahí se llega al dormitorio y a la
  escalera sin pasar por ningún garaje. El dormitorio, detrás, sale más
  grande y tiene una ventana nueva al patio.
salida: variantes/salida/r3.sh3d
resumen: variantes/salida/r3.md
plantas:
  - id: pb
    huecos:
      - {nombre: Ventanuco,        muro: fachada, x: 1.45, ancho: 0.40, alto: 0.45, elevacion: 1.00, tipo: ventana}
