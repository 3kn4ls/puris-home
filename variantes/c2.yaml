# C2 · Con cochera · Baño delante con el ventanuco, dormitorio al fondo con chimenea
base: casa.yaml
nombre: "C2 · Baño delante y dormitorio al fondo con chimenea"
descripcion: >
  El baño se coloca en la esquina delantera izquierda, aprovechando el
  ventanuco. El dormitorio va al fondo izquierda y se queda con la chimenea.
  En el centro hay una sola zona de día: la cocina en línea junto al muro
  central, el comedor y el salón, con salida al patio. Bajo la escalera
  queda un trastero o despensa, y la cochera se mantiene entera.
