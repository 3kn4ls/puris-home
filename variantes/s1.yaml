# S1 · Sin cochera · Salón en la antigua cochera, dormitorio al fondo derecha
base: casa.yaml
nombre: "S1 · Salón en la antigua cochera"
descripcion: >
  El portón de la cochera se convierte en un ventanal y esa parte delantera
  pasa a ser el salón, abierto a la zona izquierda por un hueco de 2,80 m en
  el muro central. El dormitorio va al fondo derecha y el baño bajo la
  escalera, con entrada desde la cocina. Toda la zona izquierda es cocina y
  comedor, con la chimenea y la salida al patio.
salida: variantes/salida/s1.sh3d
