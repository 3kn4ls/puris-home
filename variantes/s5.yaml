# S5 · Sin cochera · Planta tipo loft: todo abierto salvo dormitorio y baño
base: casa.yaml
nombre: "S5 · Loft: todo abierto salvo dormitorio y baño"
descripcion: >
  Es la opción más diáfana. Solo se cierran el dormitorio, en la esquina
  delantera izquierda con el ventanuco, y el baño bajo la escalera. El
  comedor ocupa la antigua cochera junto al ventanal, la cocina con isla va
  en la pared derecha al fondo, y el salón con la chimenea queda a la
  izquierda, junto a la salida al patio.
