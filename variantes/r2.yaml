# R2 · Reglas de Edu · Con cochera · Baño delante con ventanuco, cocina en línea junto al muro central
base: casa.yaml
nombre: "R2 · Con cochera: baño delante y cocina en línea"
descripcion: >
  Sigue las reglas de Edu. El baño ocupa la esquina delantera izquierda, con
  el ventanuco. La cocina va en línea contra el muro central, con isla, y el
  comedor en el centro. El salón queda al fondo junto a la chimenea y la
  salida al patio. El dormitorio va detrás de la cochera, con una ventana
  nueva al patio, y la cochera se mantiene como en R1.
salida: variantes/salida/r2.sh3d
resumen: variantes/salida/r2.md
