# S2 · Sin cochera · Dormitorio delante en la antigua cochera, cocina-salón diáfano a la izquierda
base: casa.yaml
nombre: "S2 · Dormitorio en la antigua cochera"
descripcion: >
  El dormitorio ocupa la antigua cochera delante, con el ventanal. Toda la
  zona izquierda, de unos 50 m² y sin tabiques, queda para cocina, comedor y
  salón, con el ventanuco sobre la encimera y la chimenea al fondo. Detrás
  del dormitorio hay una zona de estar o estudio que da a la escalera, y el
  baño va bajo la escalera.
salida: variantes/salida/s2.sh3d
resumen: variantes/salida/s2.md
plantas:
  - id: pb
    huecos:
      - {nombre: Ventanuco,        muro: fachada, x: 1.45, ancho: 0.40, alto: 0.45, elevacion: 1.00, tipo: ventana}
      - {nombre: Puerta de entrada, muro: fachada, x: 3.45, ancho: 2.00, alto: 2.60, elevacion: 0.00, tipo: puerta}
      - {nombre: Ventanal (antiguo portón), muro: fachada, x: 8.40, ancho: 2.45, alto: 2.60, elevacion: 0.00, tipo: ventana}
      - {nombre: Puerta al patio,  muro: fondo,   x: 4.80, ancho: 0.90, alto: 2.10, elevacion: 0.00, tipo: puerta}
    tabiques:
