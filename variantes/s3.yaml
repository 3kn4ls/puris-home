# S3 · Sin cochera · Suite al fondo derecha con baño en suite bajo la escalera
base: casa.yaml
nombre: "S3 · Suite al fondo con baño en suite"
descripcion: >
  El dormitorio grande, de unos 12 m², ocupa el fondo derecha y tiene el baño
  en suite bajo la escalera, con entrada desde el propio dormitorio. Toda la
  parte delantera, la antigua cochera con el ventanal más la zona izquierda,
  forma una sola zona de día: salón a la derecha y cocina y comedor a la
  izquierda, con la chimenea y la salida al patio.
