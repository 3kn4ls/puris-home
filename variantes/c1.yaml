# C1 · Con cochera · Dormitorio delante, salón con chimenea al fondo, baño bajo la escalera
base: casa.yaml
nombre: "C1 · Dormitorio delante y baño bajo la escalera"
descripcion: >
  El dormitorio ocupa la esquina delantera izquierda y aprovecha el ventanuco.
  Al entrar por el portón se llega directamente a un único espacio de cocina,
  comedor y salón, con la chimenea al fondo y la salida al patio. El baño
  completo, con plato de ducha, va bajo la escalera y se entra desde el salón.
  La cochera se mantiene entera.
