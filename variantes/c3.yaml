# C3 · Con cochera · Cocina abierta delante, dormitorio al fondo con chimenea, baño bajo la escalera
base: casa.yaml
nombre: "C3 · Cocina abierta delante y baño bajo la escalera"
descripcion: >
  La cocina en L, abierta, ocupa la esquina delantera con el ventanuco sobre
  la encimera. El dormitorio va al fondo izquierda con la chimenea, y el
  salón queda en el centro con salida al patio. El baño con ducha va bajo la
  escalera, con entrada desde el salón. Es la opción con más zona de día
  abierta, y la cochera se mantiene.
