# S4 · Sin cochera · Cocina-comedor en la antigua cochera, baño amplio al fondo derecha
base: casa.yaml
nombre: "S4 · Cocina en la antigua cochera"
descripcion: >
  La cocina y el comedor pasan a la antigua cochera, con el ventanal y una
  encimera larga en la pared derecha, abiertos al salón por un hueco de 3 m
  en el muro central. Al fondo derecha hay un baño amplio, de unos 6 m², y
  una zona de lavadero. A la izquierda queda el salón con el ventanuco, y el
  dormitorio al fondo izquierda con la chimenea.
salida: variantes/salida/s4.sh3d
resumen: variantes/salida/s4.md
plantas:
  - id: pb
    huecos:
      - {nombre: Ventanuco,        muro: fachada, x: 1.45, ancho: 0.40, alto: 0.45, elevacion: 1.00, tipo: ventana}
      - {nombre: Puerta de entrada, muro: fachada, x: 3.45, ancho: 2.00, alto: 2.60, elevacion: 0.00, tipo: puerta}
      - {nombre: Ventanal (antiguo portón), muro: fachada, x: 8.40, ancho: 2.45, alto: 2.60, elevacion: 0.00, tipo: ventana}
      - {nombre: Puerta al patio,  muro: fondo,   x: 4.80, ancho: 0.90, alto: 2.10, elevacion: 0.00, tipo: puerta}
    tabiques:
