# C5 · Con cochera · Dormitorio semiabierto separado por el armario, baño bajo la escalera
base: casa.yaml
nombre: "C5 · Dormitorio semiabierto tras el armario"
descripcion: >
  Es la opción más diáfana con cochera. El dormitorio ocupa el fondo
  izquierda, con la chimenea, y no tiene tabique hacia el salón: lo separa
  un armario exento de 2,40 m y un murete parcial. La cocina va en línea
  junto al muro central con una isla, y el salón y el comedor dan a la
  calle. El baño va bajo la escalera, y la cochera se mantiene.
