# C4 · Con cochera · Dormitorio con baño en suite delante, cocina al fondo junto al patio
base: casa.yaml
nombre: "C4 · Dormitorio con baño en suite y cocina junto al patio"
descripcion: >
  Toda la franja izquierda delantera es la zona de noche: el dormitorio, con
  el ventanuco, y detrás un baño amplio en suite. La cocina se pone en línea
  contra el muro del fondo, junto a la salida al patio, con isla. La
  chimenea queda en el comedor y el salón mira a la calle. Bajo la escalera
  hay trastero o despensa, y la cochera se mantiene.
